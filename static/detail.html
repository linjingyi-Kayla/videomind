<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <link rel="manifest" href="/manifest.json" />
    <title>视频详情 · VideoMind</title>
    <style>
      html { background: #fff; }
      :root {
        --line: rgba(0, 0, 0, 0.08);
        --text: #2a2a2a;
        --muted: #5c5c5c;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
        background: #fff;
        color: var(--text);
        padding-bottom: calc(150px + env(safe-area-inset-bottom));
      }
      header {
        position: sticky;
        top: 0;
        z-index: 10;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: max(10px, env(safe-area-inset-top)) 14px 12px;
        background: #fff;
        border-bottom: 1px solid var(--line);
      }
      header a.back {
        text-decoration: none;
        color: #333;
        font-weight: 700;
        font-size: 15px;
      }
      .wrap {
        max-width: 720px;
        margin: 0 auto;
        padding: 12px 14px 24px;
      }
      .media {
        aspect-ratio: 16/9;
        border-radius: 12px;
        overflow: hidden;
        background: #f0f0f0;
        margin-bottom: 14px;
        position: relative;
      }
      .media img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center;
        position: absolute;
        inset: 0;
      }
      h1 {
        font-size: 18px;
        line-height: 1.35;
        margin: 0 0 10px;
      }
      h1 a {
        color: inherit;
      }
      .cat {
        display: inline-block;
        font-size: 12px;
        padding: 4px 10px;
        border-radius: 999px;
        background: rgba(0, 0, 0, 0.06);
        color: var(--muted);
        margin-bottom: 12px;
      }
      .summary-full {
        font-size: 15px;
        line-height: 1.6;
        color: var(--muted);
        white-space: pre-wrap;
        margin-bottom: 16px;
      }
      .kp {
        margin: 0 0 16px;
        padding: 0 0 0 18px;
      }
      .kp li {
        margin-bottom: 8px;
        color: var(--text);
      }
      .actions {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        margin-bottom: 16px;
      }
      .btn {
        border: 0;
        border-radius: 12px;
        padding: 10px 16px;
        font-weight: 700;
        cursor: pointer;
        font-size: 14px;
      }
      .btn-heart {
        background: rgba(200, 100, 120, 0.2);
        color: #8a3d4d;
      }
      .btn-heart.on {
        background: rgba(200, 100, 120, 0.45);
      }
      .note-label {
        font-weight: 800;
        font-size: 14px;
        margin-bottom: 8px;
      }
      textarea {
        width: 100%;
        min-height: 120px;
        border-radius: 12px;
        border: 1px solid var(--line);
        padding: 12px;
        font-size: 15px;
        resize: vertical;
        background: #fafafa;
      }
      .btn-save {
        margin-top: 10px;
        background: #2c2c2c;
        color: #fff;
      }
      .btn-chat {
        background: #3d5c48;
        color: #fff;
      }
      .err {
        color: #b42318;
        padding: 16px;
      }
      .detail-bar {
        display: none;
      }

      /* 问视频抽屉 */
      .chat-overlay {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 200;
        background: rgba(0, 0, 0, 0.35);
      }
      .chat-overlay.open {
        display: block;
      }
      .chat-drawer {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        max-height: min(78dvh, 640px);
        display: flex;
        flex-direction: column;
        background: #fff;
        border-radius: 16px 16px 0 0;
        border-top: 1px solid var(--line);
        box-shadow: 0 -8px 32px rgba(0, 0, 0, 0.12);
        padding-bottom: env(safe-area-inset-bottom);
      }
      .chat-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 14px 16px 10px;
        border-bottom: 1px solid var(--line);
        flex-shrink: 0;
      }
      .chat-head h2 {
        margin: 0;
        font-size: 16px;
        font-weight: 800;
      }
      .chat-close {
        border: 0;
        background: transparent;
        font-size: 22px;
        line-height: 1;
        cursor: pointer;
        color: #666;
        padding: 4px 8px;
      }
      .chat-hint {
        margin: 0;
        padding: 8px 16px;
        font-size: 12px;
        color: var(--muted);
        background: #f7f7f7;
        border-bottom: 1px solid var(--line);
        flex-shrink: 0;
      }
      .chat-messages {
        flex: 1;
        overflow-y: auto;
        padding: 12px 14px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        min-height: 160px;
      }
      .chat-bubble {
        max-width: 92%;
        padding: 10px 12px;
        border-radius: 14px;
        font-size: 14px;
        line-height: 1.5;
        white-space: pre-wrap;
        word-break: break-word;
      }
      .chat-bubble.user {
        align-self: flex-end;
        background: #3d5c48;
        color: #fff;
        border-bottom-right-radius: 4px;
      }
      .chat-bubble.assistant {
        align-self: flex-start;
        background: #f2f2f2;
        color: var(--text);
        border-bottom-left-radius: 4px;
      }
      .chat-bubble.assistant a.ts-link {
        color: #0b57d0;
        font-weight: 700;
        text-decoration: underline;
        text-underline-offset: 2px;
        cursor: pointer;
      }
      .chat-bubble.assistant a.ts-link:hover {
        color: #0842a0;
      }
      .chat-bubble.loading {
        color: #888;
        font-style: italic;
        display: inline-flex;
        align-items: center;
        gap: 8px;
      }
      .chat-bubble.loading .spinner {
        width: 14px;
        height: 14px;
        border: 2px solid #ccc;
        border-top-color: #3d5c48;
        border-radius: 50%;
        animation: chat-spin 0.7s linear infinite;
        flex-shrink: 0;
      }
      @keyframes chat-spin {
        to {
          transform: rotate(360deg);
        }
      }
      .chat-empty {
        text-align: center;
        color: #999;
        font-size: 13px;
        padding: 24px 12px;
      }
      .chat-compose {
        display: flex;
        gap: 8px;
        padding: 10px 12px 12px;
        border-top: 1px solid var(--line);
        flex-shrink: 0;
        background: #fff;
      }
      .chat-compose input {
        flex: 1;
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 10px 12px;
        font-size: 15px;
        outline: none;
        background: #fafafa;
      }
      .chat-compose button {
        flex-shrink: 0;
        border: 0;
        border-radius: 12px;
        padding: 10px 14px;
        font-weight: 700;
        background: #3d5c48;
        color: #fff;
        cursor: pointer;
      }
      .chat-compose button:disabled {
        opacity: 0.55;
        cursor: not-allowed;
      }
      .bottom-nav {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 80;
        display: flex;
        justify-content: space-around;
        align-items: center;
        padding: 8px 4px calc(8px + env(safe-area-inset-bottom));
        background: #fff;
        border-top: 1px solid var(--line);
      }
      .bottom-nav a {
        flex: 1;
        text-align: center;
        text-decoration: none;
        color: #666;
        font-size: 10px;
        padding: 4px 2px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2px;
      }
      .bottom-nav a.active {
        color: #3d5c48;
        font-weight: 800;
      }
      .bottom-nav svg {
        width: 24px;
        height: 24px;
        stroke: currentColor;
        fill: none;
        stroke-width: 1.65;
        overflow: visible;
      }
    </style>
  </head>
  <body>
    <header>
      <a class="back" href="/">← 返回</a>
      <span id="headerTitle" style="font-weight:800;">详情</span>
    </header>
    <div class="wrap" id="root">
      <p class="err" id="err" style="display: none"></p>
      <div id="content" style="display: none">
        <div class="media">
          <img id="cover" alt="" />
        </div>
        <div class="cat" id="cat"></div>
        <h1><a id="titleLink" href="#" target="_blank" rel="noopener"></a></h1>
        <div class="summary-full" id="summary"></div>
        <ul class="kp" id="kp"></ul>
        <div class="actions">
          <button type="button" class="btn btn-heart" id="btnHeart">♡ 收藏</button>
          <button type="button" class="btn btn-chat" id="btnChat">问视频</button>
          <a class="btn" id="openYt" href="#" target="_blank" rel="noopener" style="background: rgba(0,0,0,0.08); text-decoration: none; color: inherit; display: inline-flex; align-items: center;">在 YouTube 打开</a>
        </div>
        <div class="note-label">我的批注</div>
        <textarea id="note" placeholder="写下你的想法…"></textarea>
        <button type="button" class="btn btn-save" id="btnSave">保存批注</button>
      </div>
    </div>

    <div class="chat-overlay" id="chatOverlay" aria-hidden="true">
      <div class="chat-drawer" role="dialog" aria-labelledby="chatTitle">
        <div class="chat-head">
          <h2 id="chatTitle">问视频</h2>
          <button type="button" class="chat-close" id="chatClose" aria-label="关闭">×</button>
        </div>
        <p class="chat-hint" id="chatHint">基于本视频字幕与总结回答；回答中的 [mm:ss] 可点击跳转。</p>
        <div class="chat-messages" id="chatMessages"></div>
        <div class="chat-compose">
          <input id="chatInput" type="text" placeholder="问一句关于这个视频的问题…" autocomplete="off" />
          <button type="button" id="chatSend">发送</button>
        </div>
      </div>
    </div>

    <nav class="bottom-nav" aria-label="主导航">
      <a href="/">
        <svg viewBox="0 0 24 24"><path d="M4 10.5L12 4l8 6.5V20a1 1 0 0 1-1 1h-5v-6H10v6H5a1 1 0 0 1-1-1v-9.5z" stroke-linejoin="round" /></svg>
        主页
      </a>
      <a href="/favorites">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z" stroke="currentColor" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round"/></svg>
        收藏
      </a>
      <a href="/profile">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4" /><path d="M6 20v-1c0-2.5 2-4 6-4s6 1.5 6 4v1" stroke-linecap="round" /></svg>
        我的
      </a>
    </nav>

    <script src="/static/auth.js"></script>
    <script>
      function qs(name) {
        const u = new URLSearchParams(window.location.search);
        return u.get(name);
      }

      function extractYouTubeId(url) {
        try {
          const u = new URL(url);
          if (u.hostname.includes('youtu.be')) return u.pathname.replace('/', '').split('/')[0];
          const v = u.searchParams.get('v');
          if (v) return v;
          const parts = u.pathname.split('/').filter(Boolean);
          if (parts[0] === 'shorts' || parts[0] === 'live') return parts[1] || null;
          return null;
        } catch (e) {
          return null;
        }
      }

      function mmssToSeconds(mmss) {
        const parts = String(mmss || '')
          .split(':')
          .map((x) => parseInt(x, 10));
        if (parts.some((n) => isNaN(n))) return null;
        if (parts.length === 2) return parts[0] * 60 + parts[1];
        if (parts.length === 3) return parts[0] * 3600 + parts[1] * 60 + parts[2];
        return null;
      }

      function youtubeTimeUrl(videoUrl, seconds) {
        const vid = extractYouTubeId(videoUrl || '');
        if (!vid || seconds == null || seconds < 0) return videoUrl || '#';
        return 'https://www.youtube.com/watch?v=' + encodeURIComponent(vid) + '&t=' + Math.floor(seconds) + 's';
      }

      function escapeHtml(s) {
        return String(s)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      }

      /** 将助手回复中的时间戳转为可点击 YouTube 跳转链接 */
      function linkifyTimestamps(text, videoUrl) {
        const esc = escapeHtml(text || '');
        // 兼容 [mm:ss] / ［mm:ss］ / 【mm:ss】 / (mm:ss) / （mm:ss），以及全角冒号
        return esc.replace(
          /[\[［【(（]\s*(\d{1,2})\s*[:：]\s*(\d{2})(?:\s*[:：]\s*(\d{2}))?\s*[\]］】)）]/g,
          function (_m, a, b, c) {
            const parts = c != null ? [a, b, c] : [a, b];
            const ts = parts.join(':');
            const sec = mmssToSeconds(ts);
            if (sec == null) return _m;
            const href = escapeHtml(youtubeTimeUrl(videoUrl, sec));
            return (
              '<a class="ts-link" href="' +
              href +
              '" target="_blank" rel="noopener noreferrer">[' +
              ts +
              ']</a>'
            );
          }
        );
      }

      function showChatLoading() {
        const empty = chatMessages.querySelector('.chat-empty');
        if (empty) empty.remove();
        let el = document.getElementById('chatLoading');
        if (el) el.remove();
        el = document.createElement('div');
        el.id = 'chatLoading';
        el.className = 'chat-bubble assistant loading';
        el.setAttribute('aria-live', 'polite');
        el.innerHTML = '<span class="spinner" aria-hidden="true"></span><span>思考中…</span>';
        chatMessages.appendChild(el);
        chatMessages.scrollTop = chatMessages.scrollHeight;
      }

      function hideChatLoading() {
        const el = document.getElementById('chatLoading');
        if (el) el.remove();
      }

      const id = qs('id');
      const errEl = document.getElementById('err');
      const content = document.getElementById('content');
      const chatOverlay = document.getElementById('chatOverlay');
      const chatMessages = document.getElementById('chatMessages');
      const chatInput = document.getElementById('chatInput');
      const chatSend = document.getElementById('chatSend');
      const chatHint = document.getElementById('chatHint');

      /** 当前任务（轮询时同步更新，供收藏按钮等使用） */
      let taskState = null;
      let chatBusy = false;
      let chatLoaded = false;

      function renderTask(it) {
        const vid = extractYouTubeId(it.video_url || '');
        const img = document.getElementById('cover');
        if (vid) {
          if (img.dataset.vmVid !== vid) {
            img.dataset.vmVid = vid;
            img.src = 'https://img.youtube.com/vi/' + vid + '/maxresdefault.jpg';
            img.addEventListener(
              'error',
              function once() {
                img.removeEventListener('error', once);
                img.src = 'https://img.youtube.com/vi/' + vid + '/hqdefault.jpg';
              },
              { once: true }
            );
          }
        }
        img.alt = it.title || (it.status === 'pending' ? '加载中' : '视频');

        document.getElementById('cat').textContent = it.category || '未分类';
        const tl = document.getElementById('titleLink');
        tl.textContent =
          it.title || (it.status === 'pending' ? '正在生成标题与总结…' : '未命名视频');
        tl.href = it.video_url || '#';

        let sumText = '（暂无总结）';
        if (it.status === 'pending') {
          sumText = it.summary || '正在生成总结，请稍候…';
        } else if (it.status === 'error') {
          sumText = it.error_message || '（处理失败）';
        } else {
          sumText = it.summary || '（暂无总结）';
        }
        const sumEl = document.getElementById('summary');
        sumEl.textContent = sumText;
        sumEl.style.color = it.status === 'error' ? '#b42318' : '';

        const kp = document.getElementById('kp');
        kp.innerHTML = '';
        (it.key_points || []).forEach((k) => {
          const li = document.createElement('li');
          li.textContent = k;
          kp.appendChild(li);
        });

        document.getElementById('openYt').href = it.video_url || '#';
        document.getElementById('note').value = it.annotation || '';

        const heart = document.getElementById('btnHeart');
        function syncHeart() {
          heart.classList.toggle('on', !!taskState.is_favorite);
          heart.textContent = taskState.is_favorite ? '♥ 已收藏' : '♡ 收藏';
        }
        syncHeart();

        const btnChat = document.getElementById('btnChat');
        if (btnChat) {
          btnChat.disabled = it.status !== 'done';
          btnChat.title = it.status === 'done' ? '' : '视频处理完成后可提问';
        }
      }

      function appendChatBubble(role, content) {
        const empty = chatMessages.querySelector('.chat-empty');
        if (empty) empty.remove();
        const div = document.createElement('div');
        div.className = 'chat-bubble ' + (role === 'user' ? 'user' : 'assistant');
        if (role === 'assistant') {
          div.innerHTML = linkifyTimestamps(content, (taskState && taskState.video_url) || '');
        } else {
          div.textContent = content;
        }
        chatMessages.appendChild(div);
        chatMessages.scrollTop = chatMessages.scrollHeight;
      }

      function renderChatList(items) {
        chatMessages.innerHTML = '';
        if (!items || !items.length) {
          const empty = document.createElement('div');
          empty.className = 'chat-empty';
          empty.textContent = '还没有对话。问一句关于这个视频的内容吧。';
          chatMessages.appendChild(empty);
          return;
        }
        items.forEach((m) => appendChatBubble(m.role, m.content));
      }

      function setChatHint(hasSubtitles, status) {
        if (status && status !== 'done') {
          chatHint.textContent = '视频仍在处理或失败，暂时无法问答。';
          return;
        }
        if (hasSubtitles) {
          chatHint.textContent = '基于本视频字幕与总结回答；回答中的 [mm:ss] 可点击跳转 YouTube。';
        } else {
          chatHint.textContent =
            '该视频暂无字幕缓存（旧任务可重新导入）。仍可依据标题/总结提问，但通常无法给出精确时间戳。';
        }
      }

      async function loadChatHistory() {
        const r = await apiFetch('/api/tasks/' + encodeURIComponent(id) + '/chat?_=' + Date.now());
        if (!r.ok) {
          const t = await r.text();
          chatMessages.innerHTML = '<div class="chat-empty">加载对话失败：' + escapeHtml(t) + '</div>';
          return;
        }
        const data = await r.json();
        setChatHint(!!data.has_subtitles, taskState && taskState.status);
        renderChatList(data.items || []);
        chatLoaded = true;
      }

      function openChat() {
        if (!taskState || taskState.status !== 'done') {
          alert('请等视频总结完成后再提问');
          return;
        }
        chatOverlay.classList.add('open');
        chatOverlay.setAttribute('aria-hidden', 'false');
        if (!chatLoaded) {
          loadChatHistory().catch((e) => console.warn(e));
        }
        setTimeout(() => chatInput.focus(), 50);
      }

      function closeChat() {
        chatOverlay.classList.remove('open');
        chatOverlay.setAttribute('aria-hidden', 'true');
      }

      async function sendChat() {
        if (chatBusy) return;
        const text = (chatInput.value || '').trim();
        if (!text) return;
        if (!taskState || taskState.status !== 'done') {
          alert('视频未就绪');
          return;
        }
        chatBusy = true;
        chatSend.disabled = true;
        chatSend.textContent = '思考中';
        chatInput.disabled = true;
        appendChatBubble('user', text);
        chatInput.value = '';
        showChatLoading();
        try {
          const r = await apiFetch('/api/tasks/' + encodeURIComponent(id) + '/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ message: text }),
            cache: 'no-store',
          });
          const data = await r.json().catch(() => ({}));
          hideChatLoading();
          if (!r.ok) {
            const detail = data.detail || '发送失败';
            appendChatBubble(
              'assistant',
              '（失败）' + (typeof detail === 'string' ? detail : JSON.stringify(detail))
            );
            return;
          }
          setChatHint(!!data.has_subtitles, taskState.status);
          if (data.assistant && data.assistant.content) {
            appendChatBubble('assistant', data.assistant.content);
          }
        } catch (e) {
          hideChatLoading();
          appendChatBubble('assistant', '（失败）' + String(e));
        } finally {
          chatBusy = false;
          chatSend.disabled = false;
          chatSend.textContent = '发送';
          chatInput.disabled = false;
          chatInput.focus();
        }
      }

      function wireActionsOnce() {
        const heart = document.getElementById('btnHeart');
        heart.onclick = async () => {
          if (!taskState) return;
          const next = !taskState.is_favorite;
          const r = await apiFetch('/api/tasks/' + encodeURIComponent(id), {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ is_favorite: next }),
            cache: 'no-store',
          });
          if (r.ok) {
            const j = await r.json();
            taskState.is_favorite = j.is_favorite;
            heart.classList.toggle('on', !!taskState.is_favorite);
            heart.textContent = taskState.is_favorite ? '♥ 已收藏' : '♡ 收藏';
          }
        };

        document.getElementById('btnSave').onclick = async () => {
          const text = document.getElementById('note').value;
          const r = await apiFetch('/api/tasks/' + encodeURIComponent(id), {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ annotation: text }),
            cache: 'no-store',
          });
          if (r.ok) {
            alert('批注已保存');
          } else {
            alert('保存失败');
          }
        };

        document.getElementById('btnChat').onclick = () => openChat();
        document.getElementById('chatClose').onclick = () => closeChat();
        chatOverlay.addEventListener('click', (e) => {
          if (e.target === chatOverlay) closeChat();
        });
        chatSend.onclick = () => sendChat();
        chatInput.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendChat();
          }
        });
      }

      wireActionsOnce();

      async function fetchAndRender(silent) {
        const resp = await apiFetch('/api/tasks/' + encodeURIComponent(id) + '?_=' + Date.now());
        if (!resp.ok) {
          if (!silent) {
            errEl.style.display = '';
            errEl.textContent = '加载失败：' + (await resp.text());
          }
          return null;
        }
        const it = await resp.json();
        taskState = it;
        errEl.style.display = 'none';
        content.style.display = '';
        renderTask(it);
        return it;
      }

      async function load() {
        if (!id) {
          errEl.style.display = '';
          errEl.textContent = '缺少任务 id';
          return;
        }
        if (window.__detailPoll) {
          clearInterval(window.__detailPoll);
          window.__detailPoll = null;
        }
        const it = await fetchAndRender(false);
        if (!it) return;

        if (it.status === 'pending') {
          window.__detailPoll = setInterval(async () => {
            try {
              const next = await fetchAndRender(true);
              if (!next || next.status !== 'pending') {
                clearInterval(window.__detailPoll);
                window.__detailPoll = null;
              }
            } catch (e) {
              console.warn(e);
            }
          }, 12000);
        }
      }

      load().catch((e) => {
        errEl.style.display = '';
        errEl.textContent = String(e);
      });
    </script>
  </body>
</html>
